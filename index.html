<style>
:root{--bg:#fff0f5;--panel:#fff9fc;--panel2:#fce5ef;--line:#edc9d9;--text:#493342;--muted:#8d7180;--accent:#e987b2;--accent2:#cb6394;--accentText:#fff;--shadow:0 16px 42px #7b46601a;--wall:#f7dce8;--floor:#d9b5a0;--wood:#9d6d55}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,color-mix(in srgb,var(--accent) 17%,transparent),transparent 36%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;transition:background .25s,color .25s}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{min-height:100vh}.sidebar{position:fixed;inset:14px auto 14px 14px;width:246px;padding:22px 14px;border:1px solid var(--line);border-radius:25px;background:color-mix(in srgb,var(--panel) 91%,transparent);backdrop-filter:blur(16px);display:flex;flex-direction:column;z-index:5;box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:9px;margin:4px 9px 28px;color:var(--text)}.brand-icon{width:34px;height:34px;flex:0 0 34px;filter:drop-shadow(0 3px 5px #d88bad33)}.brand-word{font-size:25px;font-weight:850;letter-spacing:-1.2px;white-space:nowrap}.brand-word span{color:var(--accent2)}.nav{display:grid;gap:5px}.nav button{border:1px solid transparent;background:transparent;text-align:left;padding:11px 12px;border-radius:13px;display:flex;gap:11px;align-items:center;color:var(--muted);font-weight:650}.nav button:hover,.nav button.active{background:color-mix(in srgb,var(--accent) 17%,var(--panel));border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--text)}.nav .ico{width:22px;text-align:center;color:var(--accent2);font-size:17px}.side-foot{margin-top:auto;border:1px solid var(--line);border-radius:17px;padding:13px;background:var(--panel2);font-size:12px;color:var(--muted)}.side-foot b{display:block;color:var(--accent2);font-size:13px;margin-bottom:5px}.main{margin-left:274px;padding:32px clamp(18px,4vw,60px) 60px;max-width:1700px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:26px}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent2);font-weight:800}.top h1{font-size:clamp(26px,3vw,36px);line-height:1.15;letter-spacing:-1.2px;margin:5px 0}.sub{margin:5px 0;color:var(--muted)}.top-actions{display:flex;gap:8px;align-items:center}.datepill,.chip{border:1px solid var(--line);border-radius:99px;padding:8px 12px;color:var(--muted);background:var(--panel);font-size:12px}.theme-quick{border:1px solid var(--line);border-radius:99px;background:var(--panel);padding:8px 12px;color:var(--text)}.grid{display:grid;gap:16px}.dashboard-grid{grid-template-columns:1.05fr .95fr}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:var(--panel);border:1px solid var(--line);border-radius:21px;padding:21px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 7px;letter-spacing:-.35px}.card h2{font-size:18px}.card h3{font-size:15px}.muted{color:var(--muted)}.small{font-size:12px}.btn{border:0;border-radius:99px;padding:10px 16px;background:var(--accent);color:var(--accentText);font-weight:750;box-shadow:0 5px 16px color-mix(in srgb,var(--accent) 22%,transparent)}.btn:hover{filter:brightness(1.04);transform:translateY(-1px)}.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);box-shadow:none}.btn.subtle{background:color-mix(in srgb,var(--accent) 14%,var(--panel));color:var(--accent2);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));box-shadow:none}.actions{display:flex;gap:9px;flex-wrap:wrap}.ring{width:168px;height:168px;border-radius:50%;border:5px solid var(--accent);box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 10%,transparent),0 0 35px color-mix(in srgb,var(--accent) 30%,transparent);display:grid;place-content:center;margin:18px auto;text-align:center}.time{font-size:38px;font-weight:650;letter-spacing:-2px}.ring-label{font-size:12px;color:var(--muted)}.focus-card{text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:300px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:700;color:var(--muted)}.field input,.field select,.field textarea,.search{width:100%;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--text);padding:11px 12px;outline:none}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}.inline{display:flex;gap:10px;align-items:center}.inline>*{flex:1}.taskrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.taskrow:last-child{border:0}.taskrow input[type=checkbox]{accent-color:var(--accent2);width:17px;height:17px}.taskrow.done .taskname{text-decoration:line-through;color:var(--muted)}.taskname{flex:1}.tag{font-size:10px;border-radius:99px;padding:4px 8px;background:var(--panel2);color:var(--accent2)}.progress{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent);border-radius:99px}.stat strong{display:block;font-size:25px;margin:6px 0}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.section-head{margin-bottom:20px}.section-head h1{font-size:30px;letter-spacing:-1px;margin:3px 0}.section-head p{margin:0;color:var(--muted)}.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.theme-choice{border:1px solid var(--line);border-radius:15px;background:var(--bg);padding:13px;text-align:left;display:flex;gap:10px;align-items:center}.theme-choice.selected{outline:2px solid var(--accent);border-color:var(--accent)}.swatches{display:flex;gap:4px;margin-top:6px}.swatches i{display:block;width:17px;height:17px;border-radius:50%;border:1px solid #0001}.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;opacity:0;transform:translateY(8px);transition:.2s;z-index:20;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:900px){.sidebar{width:205px}.main{margin-left:225px;padding:25px 18px}.dashboard-grid,.two{grid-template-columns:1fr}}@media(max-width:650px){.sidebar{position:static;width:auto;inset:auto;margin:10px;height:auto;padding:12px}.brand{margin:4px 8px 12px}.nav{grid-template-columns:repeat(4,1fr)}.nav button{justify-content:center;padding:9px 4px;font-size:11px;gap:4px;flex-direction:column}.side-foot{display:none}.main{margin:0;padding:15px}.top{align-items:flex-start}.top-actions{flex-direction:column;align-items:flex-end}.three,.theme-grid{grid-template-columns:1fr 1fr}}
/* Themes */
body[data-theme="pink"]{--bg:#fff0f5;--panel:#fff9fc;--panel2:#fce5ef;--line:#edc9d9;--text:#493342;--muted:#8d7180;--accent:#e987b2;--accent2:#cb6394;--accentText:#fff;--wall:#f7dce8;--floor:#d9b5a0;--wood:#9d6d55;--doodle:#c77d9e;--shadow:0 16px 42px #7b46601a}
body[data-theme="midnight"]{--bg:#0d111b;--panel:#171e2c;--panel2:#202a3c;--line:#344158;--text:#edf1ff;--muted:#a0acc2;--accent:#9eafff;--accent2:#b6c2ff;--accentText:#141a2b;--wall:#273149;--floor:#51463f;--wood:#765c4e;--doodle:#9eafff;--shadow:0 16px 42px #0005}
body[data-theme="light"]{--bg:#f2ede7;--panel:#fbf8f4;--panel2:#eee7df;--line:#e0d5cb;--text:#403832;--muted:#897d73;--accent:#c4a69b;--accent2:#9b8177;--accentText:#fff;--wall:#ece4db;--floor:#cfc8be;--wood:#b8ab99;--doodle:#c4a69b;--shadow:0 16px 42px #6d55451a}
body[data-theme="mono"]{--bg:#111113;--panel:#242326;--panel2:#323136;--line:#48464d;--text:#f2f0f2;--muted:#b0adb4;--accent:#b9b7bd;--accent2:#e0dde2;--accentText:#171619;--wall:#343238;--floor:#57545b;--wood:#77737b;--doodle:#a8a5ad;--shadow:0 16px 42px #0008}
body[data-theme="noirpink"]{--bg:#050505;--panel:#111012;--panel2:#1b1519;--line:#38232c;--text:#fff4f7;--muted:#bba7ae;--accent:#f28eaa;--accent2:#ffb5c7;--accentText:#210d15;--wall:#21161b;--floor:#33252b;--wood:#62434f;--doodle:#f28eaa;--shadow:0 16px 42px #000b}
body[data-theme="hollowpurple"]{--bg:#090311;--panel:#160B20;--panel2:#241032;--line:#48205F;--text:#F7ECFF;--muted:#BDA8D0;--accent:#C42BFA;--accent2:#E05BFF;--accentText:#13001C;--wall:#1B0B2B;--floor:#321044;--wood:#54206F;--doodle:#D52AFF;--shadow:0 16px 42px #8B00FF30;}
.afterlife-confetti{position:fixed;inset:0;z-index:9999;pointer-events:none;overflow:hidden}
.afterlife-confetti i{position:absolute;top:-18px;width:9px;height:15px;border-radius:2px;animation:afterlife-fall 3.4s ease-in forwards;transform:rotate(0deg)}
.afterlife-confetti i:nth-child(6n){background:#f5a7c8}.afterlife-confetti i:nth-child(6n+1){background:#9be7a2}.afterlife-confetti i:nth-child(6n+2){background:#f8d77b}.afterlife-confetti i:nth-child(6n+3){background:#b9a4f5}.afterlife-confetti i:nth-child(6n+4){background:#8ddbe5}
@keyframes afterlife-fall{to{transform:translate3d(var(--drift),110vh,0) rotate(760deg);opacity:.2}}

.app{position:relative;isolation:isolate}
.main{position:relative;z-index:2;pointer-events:none}.main>*{pointer-events:auto}
.sidebar{z-index:5}
.life-garden{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;user-select:none}
.garden-flower,.garden-float{position:absolute;display:block;line-height:1;pointer-events:auto;cursor:default;transform-origin:center;will-change:transform,opacity;filter:drop-shadow(0 3px 5px #0002);transition:transform 3.2s cubic-bezier(.18,.55,.25,1),filter 1.2s ease,opacity 1.2s ease}
.garden-flower{font-size:var(--size,30px);opacity:var(--opacity,.48);animation:garden-bob var(--speed,7s) ease-in-out infinite;animation-delay:var(--delay,0s);transform:translate(var(--chase-x,0px),var(--chase-y,0px))}
.garden-flower:hover{filter:drop-shadow(0 0 5px currentColor) drop-shadow(0 3px 5px #0002);opacity:.72;scale:1.04}
.garden-float{font-size:var(--size,18px);opacity:var(--opacity,.35);animation:garden-drift var(--speed,17s) ease-in-out infinite;animation-delay:var(--delay,0s)}
.garden-float:hover{animation-play-state:paused;transform:scale(1.5) rotate(12deg);opacity:.9}
}
@keyframes garden-bob{0%,100%{translate:0 0;rotate:-1deg}50%{translate:1px -2px;rotate:1deg}}
@keyframes garden-drift{0%,100%{translate:0 0;rotate:-8deg}50%{translate:12px -18px;rotate:10deg}}
@media(prefers-reduced-motion:reduce){.garden-flower,.garden-float{animation:none}.garden-flower:hover,.garden-float:hover{transform:none}}
.section-head{position:relative}
.section-head .eyebrow:before{content:"✿ ";color:#e9a3c4;font-size:1.05em}
.card h2:before{content:"✧";display:inline-block;margin-right:8px;color:#e8b86b;font-size:.82em;vertical-align:1px;opacity:.8}
.theme-choice{transition:transform .18s ease,box-shadow .18s ease}
.theme-choice:hover{transform:translateY(-2px);box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 14%,transparent)}
.theme-choice .swatches i{width:22px;height:22px;border-radius:8px}
@media(max-width:700px){.life-garden{inset:0}.garden-flower{font-size:calc(var(--size,30px)*.78)}.garden-float{font-size:calc(var(--size,18px)*.85)}}

.food-suggestions{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.food-chip{border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--accent) 12%,var(--panel));color:var(--text);border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
.food-chip:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,var(--panel))}
.food-chip b{color:var(--accent2);margin-right:4px}
.food-picked{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.food-picked span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 10px;font-size:13px}
.food-picked button{border:0;background:transparent;color:var(--muted);padding:0 2px;cursor:pointer;font-size:16px}
.nourish-entry{padding:16px 0;border-bottom:1px solid var(--line)}
.nourish-entry:last-child{border-bottom:0}
.nourish-entry h3{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.nourish-entry .entry-title{font-weight:600;margin-bottom:5px}
.nourish-entry .entry-meta{font-size:13px;color:var(--muted)}

.meal-delete{width:34px!important;height:34px!important;min-width:34px!important;padding:0!important;display:inline-flex!important;align-items:center;justify-content:center;border:1px solid var(--line)!important;border-radius:50%!important;background:var(--panel2)!important;color:var(--muted)!important;font-size:18px!important;line-height:1!important;cursor:pointer}
.meal-delete:hover{color:var(--text)!important;border-color:var(--accent)!important}
.meal-group-head{display:flex;align-items:center;justify-content:space-between;gap:12px}

.move-clock{display:flex;align-items:center;justify-content:center;flex-direction:column;width:248px;height:248px;max-width:65vw;max-height:65vw;border-radius:50%;border:4px solid var(--accent);box-shadow:0 0 0 12px color-mix(in srgb,var(--accent) 12%,transparent),0 0 38px color-mix(in srgb,var(--accent) 42%,transparent);margin:12px auto 28px;text-align:center;background:color-mix(in srgb,var(--panel) 75%,transparent)}
.move-clock .time{font-size:48px;font-variant-numeric:tabular-nums;letter-spacing:-2px}
.move-clock .ring-label{font-size:13px;color:var(--muted)}
.move-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.move-actions .btn{min-width:130px}
.move-history-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.move-history-row:last-child{border-bottom:0}
.move-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 10px;font-size:12px;color:var(--muted)}
.move-delete{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:var(--panel2);color:var(--muted);cursor:pointer;font-size:17px}
.move-delete:hover{color:var(--text);border-color:var(--accent)}
.move-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.move-form-grid .field{min-width:0}
@media(max-width:720px){.move-history-row{grid-template-columns:minmax(0,1fr) auto;gap:8px}.move-history-row .move-date{grid-column:1}.move-history-row .move-delete{grid-column:2;grid-row:1/3}.move-form-grid{grid-template-columns:1fr}}


.reflections-page{display:flex;flex-direction:column;gap:18px;color:var(--text)}
.reflection-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.reflection-stat,.reflection-panel{border:1px solid color-mix(in srgb,var(--line) 75%,transparent);border-radius:22px;background:color-mix(in srgb,var(--panel) 88%,transparent);box-shadow:var(--shadow);padding:18px;min-width:0}
.reflection-stat .stat-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:750}
.reflection-stat strong{display:block;font-size:25px;letter-spacing:-.04em;margin:5px 0 0}
.reflection-stat small{color:var(--muted)}
.reflection-panel h2{font-size:19px;margin:0 0 4px}
.reflection-panel .panel-sub{color:var(--muted);margin:0 0 16px}
.reflection-month-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.reflection-month-head button,.reflection-date-controls button{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:8px 13px}
.reflection-chart{height:210px;display:grid;grid-template-columns:repeat(31,minmax(0,1fr));gap:5px;align-items:end;border-bottom:1px solid var(--line);padding:12px 0 0}
.reflection-bar-wrap{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;min-width:0}
.reflection-bar{width:min(100%,24px);min-height:2px;border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 38%,#3e9b82));cursor:pointer;opacity:.85}
.reflection-bar.selected{outline:2px solid var(--text);outline-offset:2px;opacity:1}
.reflection-bar-label{font-size:10px;color:var(--muted)}
.reflection-calendar-layout{display:grid;grid-template-columns:minmax(260px,.72fr) minmax(0,1.5fr);gap:18px;margin-top:18px}
.reflection-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.reflection-calendar .weekday{font-size:11px;text-align:center;color:var(--muted);padding:4px 0}
.reflection-day{min-height:40px;border:1px solid transparent;background:var(--panel2);border-radius:10px;color:var(--text);font-size:12px;padding:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.reflection-day .day-min{font-size:9px;color:var(--muted)}
.reflection-day.has-study{background:color-mix(in srgb,#6dbf80 var(--heat,25%),var(--panel2));}
.reflection-day.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.reflection-day:disabled{opacity:.25}
.reflection-detail{min-width:0}
.reflection-date-controls{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.reflection-date-controls input{max-width:170px}
.reflection-timebar{position:relative;height:44px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(90deg,transparent 24.8%,var(--line) 25%,transparent 25.2%,transparent 49.8%,var(--line) 50%,transparent 50.2%,transparent 74.8%,var(--line) 75%,transparent 75.2%),var(--panel2);overflow:hidden;margin:12px 0 8px}
.reflection-time-block{position:absolute;top:5px;height:32px;min-width:3px;border-radius:7px;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 40%,#379c81));}
.reflection-time-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
.reflection-timeline{margin-top:18px;display:flex;flex-direction:column;gap:0}
.reflection-event{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 65%,transparent)}
.reflection-event .dot{width:10px;height:10px;border-radius:50%;background:#75c979;margin-top:5px;box-shadow:0 0 0 4px color-mix(in srgb,#75c979 15%,transparent)}
.reflection-event.break .dot{background:var(--muted);box-shadow:none}
.reflection-event strong{font-size:14px}
.reflection-event small{display:block;color:var(--muted);margin-top:2px}
.reflection-heatmap{display:grid;grid-template-columns:repeat(53,minmax(0,1fr));gap:4px;overflow:hidden}
.reflection-heat{aspect-ratio:1;border-radius:3px;background:var(--panel2);min-width:0}
.reflection-heat[data-level="1"]{background:#477d52}.reflection-heat[data-level="2"]{background:#5c9d60}.reflection-heat[data-level="3"]{background:#83c76b}.reflection-heat[data-level="4"]{background:#b0ed78}
.reflection-two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.reflection-pattern-bars{display:flex;align-items:end;gap:10px;height:145px;border-bottom:1px solid var(--line);padding-top:16px}
.reflection-pattern-item{flex:1;min-width:0;text-align:center;color:var(--muted);font-size:11px}
.reflection-pattern-item i{display:block;margin:0 auto 7px;width:min(100%,35px);height:var(--h);min-height:2px;border-radius:7px 7px 0 0;background:linear-gradient(180deg,#9bdf70,#299b81)}
.reflection-progress-row{display:grid;grid-template-columns:95px minmax(40px,1fr) 58px;align-items:center;gap:10px;margin:13px 0;color:var(--muted);font-size:13px}
.reflection-progress-track{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.reflection-progress-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#9bdf70,#299b81)}
.reflection-rhythm{display:flex;align-items:center;gap:18px}
.reflection-rhythm strong{font-size:42px;line-height:1}
.reflection-rhythm span{color:var(--muted)}
.reflection-empty{padding:14px;border-radius:14px;background:var(--panel2);color:var(--muted)}
.reflection-record{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
@media(max-width:950px){.reflection-stats{grid-template-columns:repeat(3,minmax(0,1fr))}.reflection-calendar-layout{grid-template-columns:1fr}.reflection-two-col{grid-template-columns:1fr}}

<main class="main"><header class="top"><div><div class="eyebrow">A little progress, every day</div><h1 id="greeting">Welcome back.</h1><p class="sub" id="subtitle">Your goals, your pace, your space.</p></div><div class="top-actions"><select class="theme-quick" id="quickTheme" aria-label="Change theme"><option value="pink">🌸 Pastel pink</option><option value="midnight">🌙 Midnight</option><option value="light">☁️ Porcelain &amp; beige</option><option value="mono">◐ Ink &amp; pearl</option><option value="noirpink">🖤 Noir rose</option><option value="hollowpurple">💜 Hollow Purple</option></select><span class="datepill" id="todayDate"></span></div></header><div id="view"></div></main>
</div><div class="toast" id="toast" role="status"></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const pages=[['today','⌂','Today'],['focus','◷','Focus'],['targets','◎','Tasks'],['move','↗','Move'],['nourish','♧','Nourish'],['reflections','✎','Reflections'],['settings','⚙','Settings']];
const themes=[['pink','Pastel pink','🌸','#fff9fc','#e987b2','#fff0f5'],['midnight','Midnight','🌙','#171e2c','#9eafff','#0d111b'],['light','Porcelain & beige','☁️','#fbf8f4','#c4a69b','#f2ede7'],['mono','Ink & pearl','◐','#242326','#b9b7bd','#111113'],['noirpink','Noir rose','🖤','#24151d','#f28eaa','#110c11'],['hollowpurple','Hollow Purple','💜','#160B20','#C42BFA','#090311']];
const defaults={name:'Keertana',theme:'pink',avatar:'👩🏻‍💻',tasks:[],sessions:[],studyIntervals:[],studyByDate:{},dailyStudyTargetMinutes:300,targetCelebratedDate:null,workouts:[],moveStopwatch:{running:false,startedAt:null,sessionStartedAt:null,sessionDate:null,elapsedSeconds:0,kind:'Strength',notes:'',speedKmh:4.5,exercise:'',intensity:'moderate',estimateCalories:true},meals:[],water:{},reflections:[],focus:{duration:50,remaining:3000,running:false,phase:'work',shortBreak:10,longBreak:30,longBreakEvery:4,autoStartBreaks:true,autoStartFocus:false,cycleCount:0,lastTickAt:null,activeTaskId:null,sounds:{enabled:true,focus:'bell',break:'glass'}},profile:{height:171,weight:76,age:25,sex:'female',activity:'light',goal:'maintain'}};
let data, page='today', timer=null, moveInterval=null, selectedDate=day(), editingTaskId=null, deleteConfirmTaskId=null, taskPeriod='today',reflectionDate=day(),reflectionMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
function load(){try{const raw=localStorage.getItem('afterlife-v3') /* legacy key retained so existing browser data remains available */;data=raw?{...structuredClone(defaults),...JSON.parse(raw)}:structuredClone(defaults);if(!themes.some(x=>x[0]===data.theme))data.theme='pink';data.focus={...structuredClone(defaults.focus),...(data.focus||{})};data.profile={...structuredClone(defaults.profile),...(data.profile||{})};data.moveStopwatch={...structuredClone(defaults.moveStopwatch),...(data.moveStopwatch||{})};data.workouts=(data.workouts||[]).map((w,i)=>({...w,id:w.id||('workout-'+i+'-'+String(w.date||'')),durationSeconds:Number(w.durationSeconds)||Math.max(60,(Number(w.minutes)||1)*60)}));data.meals=(data.meals||[]).map((m,i)=>({...m,id:m.id||('legacy-'+i+'-'+String(m.date||''))}));data.studyByDate=data.studyByDate||{};data.studyIntervals=Array.isArray(data.studyIntervals)?data.studyIntervals:[];data.dailyStudyTargetMinutes=Number(data.dailyStudyTargetMinutes)||300;data.focus.activeTaskId=data.focus.activeTaskId||null;data.focus.sounds={enabled:true,focus:'bell',break:'glass',...(data.focus.sounds||{})};if(!Object.keys(data.studyByDate).length&&Array.isArray(data.sessions)){for(const s of data.sessions){if(s.date)data.studyByDate[s.date]=(data.studyByDate[s.date]||0)+(Number(s.minutes)||0)*60;}}}catch(e){data=structuredClone(defaults)}}
function save(){try{localStorage.setItem('afterlife-v3',JSON.stringify(data))}catch(e){notify('Browser storage is unavailable. Export a backup to keep your data.')}}
function notify(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function day(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(s){s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function todayTasks(){return data.tasks.filter(t=>t.date===day())}
function todaySessions(){return data.sessions.filter(s=>s.date===day())}
function todayWorkouts(){return data.workouts.filter(w=>w.date===day())}
function workoutSeconds(w){return Math.max(0,Number(w.durationSeconds)||((Number(w.minutes)||0)*60))}
function workoutTotalSeconds(list){return list.reduce((a,w)=>a+workoutSeconds(w),0)}
function workoutClock(seconds){seconds=Math.max(0,Math.floor(seconds||0));return String(Math.floor(seconds/3600)).padStart(2,'0')+':'+String(Math.floor(seconds%3600/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function workoutMet(kind,speed,intensity){if(kind==='Walk'){const v=Number(speed)||4.5;return v<3?2:v<4?2.8:v<=5?3.2:v<=5.5?3.8:v<=6.5?4.3:5}if(kind==='Strength')return intensity==='vigorous'?6:intensity==='light'?3:4.5;if(kind==='Cardio')return intensity==='vigorous'?8:intensity==='light'?4.5:6.5;if(kind==='Yoga')return intensity==='vigorous'?3.5:intensity==='light'?2:2.5;if(kind==='Sport')return intensity==='vigorous'?9:intensity==='light'?5:7;if(kind==='Mobility')return 2.3;return intensity==='vigorous'?5:intensity==='light'?2.5:3}
function estimateWorkoutCalories(kind,seconds,speed,intensity,weight){const kg=Number(weight)||Number(data.profile.weight)||0;if(!kg||!seconds)return 0;return Math.max(0,Math.round(workoutMet(kind,speed,intensity)*3.5*kg/200*(seconds/60)))}
function workoutDetails(kind,speed,exercise,intensity){const extra=kind==='Walk'&&speed?` · ${Number(speed).toFixed(1)} km/h`:kind==='Strength'&&exercise?` · ${exercise}`:'';return extra+(intensity&&kind!=='Walk'?' · '+intensity:'')}
function moveElapsed(){const m=data.moveStopwatch;return Math.max(0,Number(m.elapsedSeconds)||0)+(m.running&&m.startedAt?Math.max(0,(Date.now()-m.startedAt)/1000):0)}
function syncMoveClock(){const clock=$('moveClock');if(clock)clock.textContent=workoutClock(moveElapsed());const status=$('moveStatus');if(status)status.textContent=data.moveStopwatch.running?'Workout in progress':'Ready when you are';const start=$('moveStart');if(start)start.textContent=data.moveStopwatch.running?'Pause workout':'Begin workout';const finish=$('moveFinish');if(finish)finish.disabled=moveElapsed()<1;}
function startMoveStopwatch(){const m=data.moveStopwatch;if(m.running){m.elapsedSeconds=moveElapsed();m.running=false;m.startedAt=null;clearInterval(moveInterval);moveInterval=null;}else{m.running=true;m.startedAt=Date.now();if(!m.sessionStartedAt){m.sessionStartedAt=m.startedAt;m.sessionDate=day();}if(!moveInterval)moveInterval=setInterval(syncMoveClock,250);}save();syncMoveClock();}
function finishMoveWorkout(){const m=data.moveStopwatch,seconds=Math.round(moveElapsed());if(seconds<1){notify('Start your stopwatch before finishing a workout');return}const kind=m.kind||'Strength',weight=Number(data.profile.weight)||0,cal=m.estimateCalories?estimateWorkoutCalories(kind,seconds,m.speedKmh,m.intensity,weight):null;const entry={id:'workout-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:m.sessionDate||day(),startedAt:m.sessionStartedAt?new Date(m.sessionStartedAt).toTimeString().slice(0,5):'',type:kind,kind,minutes:Math.max(1,Math.round(seconds/60)),durationSeconds:seconds,notes:m.notes||'',speedKmh:kind==='Walk'?Number(m.speedKmh)||4.5:null,exercise:kind==='Strength'?(m.exercise||''): '',intensity:m.intensity||'moderate',weightKg:weight||null,calories:cal,calorieEstimate:cal!==null};data.workouts.unshift(entry);m.running=false;m.startedAt=null;m.sessionStartedAt=null;m.sessionDate=null;m.elapsedSeconds=0;m.notes='';m.exercise='';clearInterval(moveInterval);moveInterval=null;save();render();notify(cal!==null?`Workout logged · approximately ${cal} kcal burned`:'Workout logged');}
function deleteWorkout(id){const before=data.workouts.length;data.workouts=data.workouts.filter(w=>w.id!==id);if(data.workouts.length===before)return;save();render();notify('Workout removed from your history');}
function savePastWorkout(){const date=$('pastWorkDate').value,rawMinutes=Number($('pastWorkMinutes').value),minutes=Math.floor(rawMinutes),kind=$('pastWorkKind').value;if(!date||date>day()||date<day(new Date(Date.now()-29*86400000))){notify('Choose a date within the last 30 days');return}if(!Number.isFinite(rawMinutes)||minutes<1){notify('Enter the workout duration in whole minutes');return}const seconds=minutes*60,speed=Number($('pastWorkSpeed').value)||4.5,intensity=$('pastWorkIntensity').value,exercise=$('pastWorkExercise').value.trim(),estimate=$('pastWorkEstimate').checked,weight=Number(data.profile.weight)||0,cal=estimate?estimateWorkoutCalories(kind,seconds,speed,intensity,weight):null;data.workouts.unshift({id:'workout-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),date,startedAt:$('pastWorkTime').value||'',type:kind,kind,minutes,durationSeconds:seconds,notes:$('pastWorkNotes').value.trim(),speedKmh:kind==='Walk'?speed:null,exercise:kind==='Strength'?exercise:'',intensity,weightKg:weight||null,calories:cal,calorieEstimate:estimate});save();render();notify(cal!==null?`Past workout added · approximately ${cal} kcal`:'Past workout added');}
function todayWorkoutRows(list){return list.map(w=>'<div class="taskrow"><span class="taskname"><b>'+esc(w.kind||w.type)+'</b><div class="muted small">'+esc(w.notes||w.exercise||'')+'</div></span><span>'+Math.max(1,Math.round(workoutSeconds(w)/60))+'m</span><b>'+(w.calorieEstimate&&w.calories?'~'+w.calories+' kcal':'')+'</b></div>').join('')}
function updateMoveFields(prefix){const kind=$(prefix+'Kind')?.value||'Strength';const speed=$(prefix+'SpeedWrap'),exercise=$(prefix+'ExerciseWrap'),intensity=$(prefix+'IntensityWrap');if(speed)speed.hidden=kind!=='Walk';if(exercise)exercise.hidden=kind!=='Strength';if(intensity)intensity.hidden=kind==='Walk'||kind==='Mobility';}

function waterToday(){return +(data.water[day()]||0)}
function studied(){return Math.floor((Number(data.studyByDate?.[day()])||0)/60)}
function studiedSeconds(){return Number(data.studyByDate?.[day()])||0}
function targetSeconds(){return Math.max(1,Number(data.dailyStudyTargetMinutes)||300)*60}
function targetProgress(){return Math.min(1,studiedSeconds()/targetSeconds())}
function activeTask(){return data.tasks.find(t=>t.id===data.focus.activeTaskId)||null}
function taskStudiedSeconds(t){return Number(t?.studyByDate?.[day()])||0}
function celebrateTarget(){if(data.targetCelebratedDate===day())return;data.targetCelebratedDate=day();save();notify('Daily study target reached! You did it!');const layer=document.createElement('div');layer.className='afterlife-confetti';layer.setAttribute('aria-hidden','true');for(let i=0;i<90;i++){const bit=document.createElement('i');bit.style.left=(Math.random()*100)+'%';bit.style.animationDelay=(Math.random()*0.9)+'s';bit.style.setProperty('--drift',(Math.random()*220-110)+'px');layer.appendChild(bit)}document.body.appendChild(layer);setTimeout(()=>layer.remove(),4200)}
function checkTarget(dateKey){if(dateKey===day()&&studiedSeconds()>=targetSeconds()&&data.targetCelebratedDate!==dateKey)celebrateTarget();}
function openStudyInterval(at=Date.now()){
 const f=data.focus;if(f.phase!=='work'||!f.running||f.currentIntervalStart)return;
 f.currentIntervalStart=at;f.currentIntervalTopic=activeTask()?.name||'Studying';
}
function closeStudyInterval(at=Date.now()){
 const f=data.focus,start=Number(f.currentIntervalStart);
 if(!start||at<=start){f.currentIntervalStart=null;f.currentIntervalTopic='';return;}
 data.studyIntervals=data.studyIntervals||[];
 data.studyIntervals.push({id:'study-'+start+'-'+Math.random().toString(36).slice(2,7),start,end:at,topic:f.currentIntervalTopic||activeTask()?.name||'Studying'});
 f.currentIntervalStart=null;f.currentIntervalTopic='';
}
function accrueStudy(fromMs,toMs){let cursor=fromMs;while(cursor<toMs){const d=new Date(cursor);const nextMidnight=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime();const end=Math.min(toMs,nextMidnight);const seconds=Math.max(0,(end-cursor)/1000);const key=day(d);data.studyByDate[key]=(Number(data.studyByDate[key])||0)+seconds;const task=activeTask();if(task){task.studyByDate=task.studyByDate||{};task.studyByDate[key]=(Number(task.studyByDate[key])||0)+seconds;}cursor=end;checkTarget(key);}}
function phaseDuration(phase){const f=data.focus;return (phase==='work'?f.duration:phase==='short'?f.shortBreak:f.longBreak)*60;}
function phaseLabel(){return data.focus.phase==='work'?'Study session':data.focus.phase==='short'?'Short break':'Long break';}
function advanceTimer(now=Date.now()){const f=data.focus;if(!f.running){f.lastTickAt=now;return}let delta=Math.max(0,now-(Number(f.lastTickAt)||now));let guard=0;while(delta>0&&f.running&&guard++<100){const left=Math.max(0,(Number(f.remaining)||0)*1000);if(left<=0){transitionPhase();continue}const used=Math.min(delta,left);if(f.phase==='work')accrueStudy(now-delta,now-delta+used);f.remaining=Math.max(0,(left-used)/1000);delta-=used;if(f.remaining<=0.001){f.remaining=0;transitionPhase(now-delta+used);}}f.lastTickAt=now;if(f.running)f.endAt=now+f.remaining*1000;else f.endAt=null;save();}
let audioContext=null;
function unlockAudio(){try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;audioContext=audioContext||new Ctx();if(audioContext.state==='suspended')audioContext.resume();}catch(e){}}
function playSoundPreset(preset){if(!preset||preset==='none')return;unlockAudio();if(!audioContext)return;const ctx=audioContext,now=ctx.currentTime;
const tone=(freq,start,duration,wave='sine',volume=.12)=>{const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=wave;osc.frequency.setValueAtTime(freq,now+start);gain.gain.setValueAtTime(.0001,now+start);gain.gain.exponentialRampToValueAtTime(volume,now+start+.012);gain.gain.exponentialRampToValueAtTime(.0001,now+start+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start(now+start);osc.stop(now+start+duration+.03)};
if(preset==='station'){[880,1174.66,1396.91,1760].forEach((f,i)=>tone(f,i*.31,.34,'sine',.13));return}
if(preset==='alarm'){[0,.32,.64,1.48,1.80,2.12].forEach(t=>tone(880,t,.19,'square',.075));return}
if(preset==='applause'){const length=Math.ceil(ctx.sampleRate*.16),buffer=ctx.createBuffer(1,length,ctx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/length,2.1);[0,.11,.24,.39,.55,.72,.91,1.08,1.28,1.5,1.74,1.98,2.2].forEach((t,i)=>{const src=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();src.buffer=buffer;filter.type='bandpass';filter.frequency.value=1200+(i%4)*260;filter.Q.value=.8;gain.gain.setValueAtTime(.0001,now+t);gain.gain.exponentialRampToValueAtTime(.22,now+t+.008);gain.gain.exponentialRampToValueAtTime(.0001,now+t+.15);src.connect(filter);filter.connect(gain);gain.connect(ctx.destination);src.start(now+t);src.stop(now+t+.17)});return}
const presets={bell:{notes:[880,1320,1760],duration:1.9,wave:'sine'},glass:{notes:[1174.66,1760,2349.32],duration:2.3,wave:'sine'},digital:{notes:[660,880],duration:1.1,wave:'triangle'},wood:{notes:[440,554.37],duration:1,wave:'triangle'},soft:{notes:[523.25,659.25,783.99],duration:2,wave:'sine'},bowl:{notes:[220,329.63,440],duration:2.8,wave:'sine'},marimba:{notes:[659.25,783.99],duration:1.4,wave:'triangle'}};
const cfg=presets[preset]||presets.bell;cfg.notes.forEach((freq,i)=>tone(freq,i*.28,cfg.duration/cfg.notes.length,'sine',.1/(1+i*.2)));}
function playPhaseCue(phase){const s=data.focus.sounds||{};if(!s.enabled)return;playSoundPreset(phase==='work'?s.focus:s.break);}
function transitionPhase(at=Date.now()){const f=data.focus;if(f.phase==='work'){closeStudyInterval(at);f.cycleCount=(Number(f.cycleCount)||0)+1;f.phase=(f.cycleCount%Math.max(1,Number(f.longBreakEvery)||4)===0)?'long':'short';f.remaining=phaseDuration(f.phase);playPhaseCue(f.phase);if(!f.autoStartBreaks)f.running=false;}else{f.phase='work';f.remaining=phaseDuration('work');playPhaseCue('work');if(!f.autoStartFocus)f.running=false;}if(f.running&&f.phase==='work')openStudyInterval(at);}
function startTimer(){const f=data.focus;if(f.running){advanceTimer(Date.now());if(f.phase==='work')closeStudyInterval(Date.now());f.running=false;f.lastTickAt=null;f.endAt=null;save();render();return;}if(!f.remaining||f.remaining<=0)f.remaining=phaseDuration(f.phase);f.running=true;f.lastTickAt=Date.now();f.endAt=f.lastTickAt+f.remaining*1000;if(f.phase==='work')openStudyInterval(f.lastTickAt);save();render();}
function stopTimer(){const f=data.focus;if(f.running)advanceTimer(Date.now());if(f.phase==='work')closeStudyInterval(Date.now());f.running=false;f.lastTickAt=null;f.endAt=null;if(f.phase!=='work'){f.phase='work';f.remaining=phaseDuration('work');}else f.remaining=phaseDuration('work');save();render();updateMiniPlayer();notify('Timer stopped. Your study time has been saved.');}
function resetTimer(){const f=data.focus;f.running=false;f.lastTickAt=null;f.endAt=null;f.phase='work';f.remaining=phaseDuration('work');save();render();updateMiniPlayer();}
function setTheme(t){if(!themes.some(x=>x[0]===t)||data.theme===t)return;data.theme=t;document.body.dataset.theme=t;$('quickTheme').value=t;save();if(page==='settings')render();syncMiniTheme();notify('Theme changed — enjoy your new space!')}
function nav(){ $('nav').innerHTML=pages.map(([id,ic,label])=>`<button type="button" class="${page===id?'active':''}" data-page="${id}"><span class="ico">${ic}</span><span>${label}</span></button>`).join('')}
function go(p){page=p;nav();render();window.scrollTo({top:0,behavior:'smooth'})}
function head(k,t,d){return `<div class="section-head"><div class="eyebrow">${k}</div><h1>${t}</h1><p>${d}</p></div>`}
const taskCategories=['No category','Study','Workout','Reading','Healthy meals','Health','Personal','Work','Other'];
function categoryOptions(selected){return taskCategories.map(c=>`<option value="${esc(c)}" ${c===selected?'selected':''}>${esc(c)}</option>`).join('')}
function taskRow(t,dateKey=selectedDate,allowFocus=(dateKey===day())){const isActive=data.focus.activeTaskId===t.id,mins=Math.floor(taskStudiedSeconds(t,dateKey)/60);if(editingTaskId===t.id)return `<div class="card" style="padding:14px;margin:10px 0;border:1px solid var(--accent)"><div class="field"><label>Task</label><input class="search" id="editTaskName" value="${esc(t.name)}" style="width:100%"></div><div class="grid two" style="gap:10px"><div class="field"><label>Category</label><select class="search" id="editTaskCategory" style="width:100%">${categoryOptions(t.category||'No category')}</select></div><div class="field"><label>Time (optional)</label><input class="search" id="editTaskTime" type="time" value="${esc(t.time||'')}" style="width:100%"></div></div><div class="inline"><button class="btn" data-save-task="${t.id}">Save</button><button class="btn ghost" data-cancel-edit="${t.id}">Cancel</button></div></div>`;if(deleteConfirmTaskId===t.id)return `<div class="taskrow"><span class="taskname">Delete <b>${esc(t.name)}</b>?</span><button class="btn" data-confirm-delete="${t.id}">Delete</button><button class="btn ghost" data-cancel-delete="${t.id}">Keep</button></div>`;return `<div class="taskrow ${t.done?'done':''}" style="gap:10px;align-items:center"><input type="checkbox" ${t.done?'checked':''} data-task="${t.id}"><span class="taskname" style="min-width:100px"><b>${esc(t.name)}</b><span class="muted small" style="display:block">${esc(t.category||'No category')}${t.time?' · '+esc(t.time):''} · ${mins?mins+'m focused':'Not started'}${isActive&&allowFocus?' · Active task':''}</span></span>${allowFocus?`<button class="btn ghost" data-start-task="${t.id}" title="Start task" ${t.done?'disabled':''}>${isActive&&data.focus.running?'↗':'▶'}</button>`:`<span class="muted small" style="min-width:62px;text-align:center">Past task</span>`}<button class="btn ghost" data-edit-task="${t.id}" title="Edit task">✎</button><button class="btn ghost" data-delete="${t.id}" title="Delete task">×</button></div>`}
function addTask(){const input=$('newTask');const name=input.value.trim();if(!name)return;data.tasks.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2),name,category:$('taskCategory')?.value||'No category',date:(page==='targets'?selectedDate:day()),time:$('taskTime')?.value||'',done:false,studyByDate:{}});save();render();notify('Task added')}
function editTask(id){editingTaskId=id;deleteConfirmTaskId=null;render()}
function saveTaskEdit(id){const t=data.tasks.find(x=>x.id===id);if(!t)return;const name=$('editTaskName').value.trim();if(!name){notify('Task name cannot be empty');return}t.name=name;t.category=$('editTaskCategory').value;t.time=$('editTaskTime').value;editingTaskId=null;save();render();notify('Task updated')}
function deleteTask(id){deleteConfirmTaskId=id;editingTaskId=null;render()}
function confirmDeleteTask(id){if(data.focus.activeTaskId===id)data.focus.activeTaskId=null;data.tasks=data.tasks.filter(x=>x.id!==id);deleteConfirmTaskId=null;save();render();notify('Task deleted')}
function shiftSelectedDate(delta){const d=new Date(selectedDate+'T12:00:00');d.setDate(d.getDate()+delta);selectedDate=day(d);editingTaskId=null;deleteConfirmTaskId=null;render()}

function gardenPointerMove(e){

   const strength=(190-dist)/190,move=3*strength;
   el.style.setProperty('--chase-x',(dx/(dist||1)*move).toFixed(1)+'px');

  }
 });
}

function attachMiniWindow(win,kind){miniWindow=win;miniKind=kind;const doc=win.document;doc.title='HocusFocus Focus';doc.body.innerHTML=miniMarkup();miniStyles(doc);doc.getElementById('miniPause').addEventListener('click',()=>{startPause();updateMiniPlayer()});doc.getElementById('miniStop').addEventListener('click',()=>{stopTimer();clearInterval(timer);timer=null;updateMiniPlayer()});win.addEventListener('pagehide',()=>{if(miniWindow===win){miniWindow=null;miniKind=null;win.clearInterval(miniInterval);miniInterval=null;}});syncMiniTheme();updateMiniPlayer();if(miniInterval)win.clearInterval(miniInterval);miniInterval=win.setInterval(()=>{if(data.focus.running)advanceTimer(Date.now());updateMiniPlayer();},1000);}
function updateMiniPlayer(){if(!miniWindow||miniWindow.closed)return;try{const d=miniWindow.document;const clock=d.getElementById('miniClock'),phase=d.getElementById('miniPhase'),task=d.getElementById('miniTask'),pause=d.getElementById('miniPause');if(clock)clock.textContent=fmt(data.focus.remaining);if(phase)phase.textContent=data.focus.phase==='work'?'FOCUS':data.focus.phase==='short'?'SHORT BREAK':'LONG BREAK';if(task)task.textContent=activeTask()?.name||'No task selected';if(pause)pause.textContent=data.focus.running?'Pause':'Resume';}catch(e){}}
async function openMiniPlayer(){unlockAudio();if(miniWindow&&!miniWindow.closed){miniWindow.focus();return}if(window.documentPictureInPicture&&window.isSecureContext){try{const win=await window.documentPictureInPicture.requestWindow({width:330,height:210});attachMiniWindow(win,'pip');return;}catch(e){console.warn('Picture-in-picture unavailable:',e)}}const win=window.open('about:blank','hocusfocus-mini','popup=yes,width=350,height=230,resizable=yes');if(!win){notify('Allow pop-ups for HocusFocus to open the mini-player');return;}attachMiniWindow(win,'popup');}
window.hocusFocusMiniAction=(action)=>{if(action==='pause')startPause();if(action==='stop'){stopTimer();clearInterval(timer);timer=null;}updateMiniPlayer();};

function bind(){

const periodShift=e.target.closest('[data-period-shift]');if(periodShift){shiftTaskPeriod(Number(periodShift.dataset.periodShift));return}

if(e.target.closest('#openMiniPlayer')){openMiniPlayer();return}
if(e.target.closest('#previewFocusSound')){unlockAudio();playSoundPreset($('focusSound').value);return}
if(e.target.closest('#previewBreakSound')){unlockAudio();playSoundPreset($('breakSound').value);return}
if(e.target.closest('#focusStart')){unlockAudio();startPause();updateMiniPlayer();return}
if(e.target.closest('#focusStop')){finishFocus();updateMiniPlayer();return}
if(e.target.closest('#focusReset')){resetFocus();updateMiniPlayer();return}
if(e.target.closest('#applyPomodoro')){const f=data.focus;const work=Math.min(240,Math.max(1,Number($('pomWork').value)||50)),short=Math.min(120,Math.max(1,Number($('pomShort').value)||10)),long=Math.min(180,Math.max(1,Number($('pomLong').value)||30)),every=Math.min(12,Math.max(2,Number($('pomEvery').value)||4));f.duration=work;f.shortBreak=short;f.longBreak=long;f.longBreakEvery=every;f.autoStartBreaks=$('autoBreaks').checked;f.autoStartFocus=$('autoFocus').checked;if(f.phase==='work')f.remaining=work*60;else if(f.phase==='short')f.remaining=short*60;else f.remaining=long*60;save();render();notify('Pomodoro settings saved');return}
if(e.target.closest('#moveStart')){const m=data.moveStopwatch;m.kind=$('liveWorkKind').value;m.notes=$('liveWorkNotes').value.trim();m.speedKmh=Number($('liveWorkSpeed')?.value)||4.5;m.exercise=$('liveWorkExercise')?.value.trim()||'';m.intensity=$('liveWorkIntensity')?.value||'moderate';m.estimateCalories=$('liveWorkEstimate').checked;startMoveStopwatch();return}
if(e.target.closest('#moveFinish')){const m=data.moveStopwatch;m.kind=$('liveWorkKind').value;m.notes=$('liveWorkNotes').value.trim();m.speedKmh=Number($('liveWorkSpeed')?.value)||4.5;m.exercise=$('liveWorkExercise')?.value.trim()||'';m.intensity=$('liveWorkIntensity')?.value||'moderate';m.estimateCalories=$('liveWorkEstimate').checked;finishMoveWorkout();return}
if(e.target.closest('#moveReset')){const m=data.moveStopwatch;if(m.running){m.running=false;m.startedAt=null;}m.elapsedSeconds=0;m.sessionStartedAt=null;m.sessionDate=null;clearInterval(moveInterval);moveInterval=null;save();render();notify('Stopwatch reset; no workout was logged');return}
if(e.target.closest('#addPastWorkout')){savePastWorkout();return}
const workoutDelete=e.target.closest('[data-delete-workout]');if(workoutDelete){deleteWorkout(workoutDelete.dataset.deleteWorkout);return}
const foodAdd=e.target.closest('[data-food-add]');if(foodAdd){mealDraftType=$('mealType')?.value||mealDraftType;mealDraftFeeling=$('mealFeel')?.value||'';const food=foodCatalog[Number(foodAdd.dataset.foodAdd)],qty=Math.max(1,Math.min(20,Math.floor(Number($('foodQty')?.value)||1)));if(!food)return;mealDraft.push({name:food.name,unit:food.unit,qty,cal:Math.round(food.cal*qty),protein:+(food.protein*qty).toFixed(1),fat:+(food.fat*qty).toFixed(1),carbs:+(food.carbs*qty).toFixed(1)});foodSearchQuery='';render();return}
if(e.target.closest('#saveMeal')){if(!mealDraft.length){notify('Add at least one food to this meal');return}const type=mealDraftType,feeling=mealDraftFeeling,desc=$('mealDescription').value.trim()||mealDraft.map(x=>`${x.qty} ${x.name}`).join(', '),cal=Math.max(0,Number($('mealCaloriesEdit').value)||0),protein=Math.max(0,Number($('mealProteinEdit').value)||0),waterMl=Math.max(0,Number($('mealWaterEdit').value)||0),draftFat=mealDraft.reduce((a,x)=>a+x.fat,0),draftCarbs=mealDraft.reduce((a,x)=>a+x.carbs,0),items=mealDraft.map(x=>({...x}));const existing=data.meals.find(m=>m.date===day()&&m.type===type&&m._groupedMeal);if(existing){existing.name=existing.name+', '+desc;existing.items=(existing.items||[]).concat(items);existing.cal+=cal;existing.protein+=protein;existing.fat+=draftFat;existing.carbs+=draftCarbs;existing.waterMl=(existing.waterMl||0)+waterMl;existing.feeling=feeling||existing.feeling;}else{data.meals.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),date:day(),type,name:desc,items,qty:1,unit:'meal',cal,protein,fat:draftFat,carbs:draftCarbs,waterMl,feeling,_groupedMeal:true});}if(waterMl)data.water[day()]=Math.max(0,waterToday()+waterMl);mealDraft=[];foodSearchQuery='';mealDraftType='Breakfast';mealDraftFeeling='';save();render();notify('Meal saved');return}
const removeDraft=e.target.closest('[data-remove-draft]');if(removeDraft){mealDraft.splice(Number(removeDraft.dataset.removeDraft),1);render();return}
const deleteMealGroup=e.target.closest('[data-delete-meal-group]');if(deleteMealGroup){const type=deleteMealGroup.dataset.deleteMealGroup;const removed=data.meals.filter(m=>m.date===day()&&m.type===type);const waterToUndo=removed.reduce((a,m)=>a+(Number(m.waterMl)||0),0);data.meals=data.meals.filter(m=>!(m.date===day()&&m.type===type));if(waterToUndo)data.water[day()]=Math.max(0,waterToday()-waterToUndo);save();render();notify(`${type} removed; calories and protein totals recalculated`);return}
if(e.target.closest('#saveReflection')){data.reflections.unshift({date:day(),mood:$('mood').value,well:$('well').value,letGo:$('letGo').value,tomorrow:$('tomorrow').value});save();render();notify('Reflection saved');return}
if(e.target.closest('#saveProfile')){data.name=$('profileName').value.trim()||'Friend';data.profile.height=Number($('profileHeight').value)||0;data.profile.weight=Number($('profileWeight').value)||0;data.profile.age=Number($('profileAge').value)||0;data.profile.sex=$('profileSex').value;data.profile.activity=$('profileActivity').value;data.profile.goal=$('profileGoal').value;save();render();notify('Profile saved');return}
if(e.target.closest('#exportData')){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hocusfocus-backup-'+day()+'.json';a.click();URL.revokeObjectURL(a.href);return}
});

$('view').addEventListener('change',e=>{if(e.target.id==='liveWorkKind'){data.moveStopwatch.kind=e.target.value;save();updateMoveFields('liveWork');return}if(e.target.id==='pastWorkKind'){updateMoveFields('pastWork');return}if(e.target.id==='mealType')mealDraftType=e.target.value;if(e.target.id==='mealFeel')mealDraftFeeling=e.target.value;});
$('view').addEventListener('input',e=>{if(['liveWorkNotes','liveWorkSpeed','liveWorkExercise','liveWorkIntensity'].includes(e.target.id)){const m=data.moveStopwatch;if(e.target.id==='liveWorkNotes')m.notes=e.target.value;if(e.target.id==='liveWorkSpeed')m.speedKmh=Number(e.target.value)||4.5;if(e.target.id==='liveWorkExercise')m.exercise=e.target.value;if(e.target.id==='liveWorkIntensity')m.intensity=e.target.value;save();}if(e.target.id==='foodSearch'){foodSearchQuery=e.target.value.trim().toLowerCase();const box=$('foodSuggestions');if(box){const list=foodCatalog.map((f,i)=>({f,i})).filter(x=>!foodSearchQuery||x.f.name.toLowerCase().includes(foodSearchQuery)||x.f.group.toLowerCase().includes(foodSearchQuery)).slice(0,14);box.innerHTML=list.map(x=>`<button type="button" class="food-chip" data-food-add="${x.i}"><b>＋</b>${esc(x.f.name)} <span class="muted small">${x.f.cal} kcal</span></button>`).join('')||'<span class="muted small">No matching foods. Try another search.</span>';}}});
$('view').addEventListener('change',e=>{
if(e.target.id==='autoBreaks'){data.focus.autoStartBreaks=e.target.checked;save();notify('Auto-start breaks '+(e.target.checked?'enabled':'disabled'));return}
if(e.target.id==='autoFocus'){data.focus.autoStartFocus=e.target.checked;save();notify('Auto-start focus '+(e.target.checked?'enabled':'disabled'));return}
if(e.target.id==='soundEnabled'){data.focus.sounds.enabled=e.target.checked;save();return}
if(e.target.id==='focusSound'||e.target.id==='breakSound'){data.focus.sounds[e.target.id==='focusSound'?'focus':'break']=e.target.value;save();return}
const c=e.target.closest('[data-task]');if(c){const t=data.tasks.find(x=>x.id===c.dataset.task);if(t){t.done=c.checked;if(t.done&&data.focus.activeTaskId===t.id)data.focus.activeTaskId=null;save();render()}return}
if(e.target.id==='taskDayNotes'){data.taskNotes=data.taskNotes||{};data.taskNotes[selectedDate]=e.target.value;save();return}
if(e.target.id==='reflectionDatePicker'){if(e.target.value){reflectionDate=e.target.value;const d=new Date(reflectionDate+'T12:00:00');reflectionMonth=new Date(d.getFullYear(),d.getMonth(),1);render()}return}
if(e.target.id==='selectedDatePicker'||e.target.id==='taskDatePicker'){if(e.target.value&&e.target.value<=day()){selectedDate=e.target.value;editingTaskId=null;deleteConfirmTaskId=null;render()}return}
if(e.target.id==='importData'){const f=e.target.files&&e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const incoming=JSON.parse(reader.result);data={...structuredClone(defaults),...incoming};save();render();notify('Backup imported')}catch(_){notify('Could not read that backup file')}};reader.readAsText(f)}
});
$('view').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='newTask')addTask();if(e.key==='Enter'&&e.target.id==='editTaskName')saveTaskEdit(editingTaskId)});
}
function init(){load();selectedDate=day();bind();if(data.focus.running){advanceTimer(Date.now());if(data.focus.phase==='work')closeStudyInterval(Date.now());data.focus.running=false;data.focus.lastTickAt=null;data.focus.endAt=null;save();}window.addEventListener('pagehide',()=>{if(data.focus.running){advanceTimer(Date.now());if(data.focus.phase==='work')closeStudyInterval(Date.now());data.focus.running=false;data.focus.lastTickAt=null;data.focus.endAt=null;save();}});nav();render();updateMiniPlayer();if(data.moveStopwatch.running){moveInterval=setInterval(syncMoveClock,250);}if(data.focus.running)timer=setInterval(()=>{advanceTimer(Date.now());refreshLiveProgress();updateMiniPlayer();if(!data.focus.running){clearInterval(timer);timer=null;}if(page==='focus'){const clock=$('focusClock');if(clock)clock.textContent=fmt(data.focus.remaining);const label=$('phaseLabel');if(label)label.textContent=phaseLabel();const eyebrow=$('phaseEyebrow');if(eyebrow)eyebrow.textContent=data.focus.running?'IN PROGRESS':'READY WHEN YOU ARE';const start=$('focusStart');if(start)start.textContent=data.focus.running?'Pause':'Start '+(data.focus.phase==='work'?'studying':'break');}},1000);}
try{init()}catch(err){console.error('HocusFocus startup error:',err);$('view').innerHTML='<section class="card"><h2>HocusFocus could not start</h2><p>Try refreshing this page. If the issue continues, export or preserve your browser data before resetting anything.</p><pre style="white-space:pre-wrap;color:var(--muted)">'+esc(err.message)+'</pre></section>';notify('Startup error — see the message on screen')}
})();
